# Render Blueprint for HireLens: the FastAPI backend and the React frontend.
# Deploy via Dashboard -> New -> Blueprint and pick this repo.
services:
  - type: web
    name: hirelens-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard, never committed
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: DATABASE_URL
        value: sqlite:///./hirelens.db
      - key: CORS_ORIGINS
        value: https://hirelens.onrender.com
      # Also allows the frontend if Render gives it a suffixed URL (e.g. hirelens-ab12.onrender.com).
      - key: CORS_ORIGIN_REGEX
        value: https://hirelens[a-z0-9-]*\.onrender\.com

  - type: web
    name: hirelens
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      # Inlined by Vite at build time; if Render suffixes the API's URL, update this and redeploy.
      - key: VITE_API_URL
        value: https://hirelens-api.onrender.com
