# Render Blueprint for the HireLens API. Deploy via Dashboard -> New -> Blueprint.
# The frontend is hosted on GitHub Pages (.github/workflows/deploy-pages.yml).
services:
  - type: web
    name: hirelens-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard, never committed
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DATABASE_URL
        value: sqlite:///./hirelens.db
      # The GitHub Pages site (origins have no path, so no /hirelens here).
      - key: CORS_ORIGINS
        value: https://bhavadharanithangaraj.github.io
